name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "7134ccc4-32bb-4301-b228-a2a0ba17466e"

[[kv_namespaces]]
binding = "kv"
id = "6950080c853341ba865383735bec68e1"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
