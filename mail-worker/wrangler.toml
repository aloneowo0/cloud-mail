[vars]
domain = ["miku01.de", "mikus.us.ci", "aloneowo.cc.cd", "aloneowo.de5.net", "hatsune01.top", "hatsune01.de"]
admin = "aloneowo@miku01.de"
jwt_secret = "98157da26ac18f2462cebdb1442d2cfd5cc59f4b71c36148f8e3d171ea414dca"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
